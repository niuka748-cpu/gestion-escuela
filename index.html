<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión Escolar</title>

  <style>
    /* Fondo celeste y rosado de la página */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #d9f3ff, #fff0f6);
      color: #243850;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* Tarjeta principal */
    .portada {
      width: min(640px, 100%);
      box-sizing: border-box;
      padding: clamp(24px, 6vw, 52px);
      background: #fff;
      border: 1px solid #d4edf9;
      border-top: 6px solid #8bcfea;
      border-radius: 26px;
      box-shadow: 0 18px 45px #294d6920;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3rem);
    }

    p {
      margin: 0;
      line-height: 1.6;
    }

    /* Perfiles disponibles en el sistema */
    .perfiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0;
      margin: 26px 0 0;
      list-style: none;
    }

    .perfiles li {
      padding: 9px 16px;
      background: #e2f5ff;
      border-radius: 20px;
      font-weight: 600;
    }

    .perfiles li:nth-child(2) {
      background: #ffe5f0;
    }

    /* Campos de inicio de sesión y botón rosado */
    .form-acceso {
      display: grid;
      gap: 8px;
      max-width: 360px;
      margin: 28px auto 0;
      text-align: left;
    }

    .form-acceso h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .form-acceso label {
      font-weight: 600;
    }

    .form-acceso input {
      min-width: 0;
      padding: 11px 12px;
      margin-bottom: 6px;
      border: 1px solid #8bcfea;
      border-radius: 10px;
      background: #f4fbff;
      color: inherit;
      font: inherit;
    }

    .form-acceso button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #ffc9df;
      color: #5b2941;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .form-acceso button:hover {
      background: #ffb5d2;
    }

    #mensaje-acceso {
      color: #894368;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f0d9e5;
      color: #894368;
    }
  </style>
</head>

<body>
  <main class="portada">
    <h1>Gestión Escolar</h1>
    <p>Portal para consultar cursos y calificaciones y gestionar matrículas.</p>

    <ul class="perfiles" aria-label="Perfiles del sistema">
      <li>Administrador</li>
      <li>Profesor</li>
      <li>Estudiante</li>
    </ul>

    <!-- Formulario de acceso para los tres perfiles -->
    <form id="form-acceso" class="form-acceso">
      <h2>Iniciar sesión</h2>

      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        autocomplete="username"
        placeholder="nombre@ejemplo.com"
        required
      >

      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        name="contrasena"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Ingresar</button>
      <p id="mensaje-acceso" role="status"></p>
    </form>

    <footer>Hecho por Norka Mideros</footer>
  </main>

  <script>
    // Muestra el estado del formulario durante la prueba visual.
    const formulario = document.querySelector('#form-acceso');
    const mensaje = document.querySelector('#mensaje-acceso');

    formulario.addEventListener('submit', function (evento) {
      evento.preventDefault();
      mensaje.textContent = 'Vista previa del formulario. El acceso se habilitará al conectar PHP y MySQL.';
    });
  </script>
</body>
</html>
